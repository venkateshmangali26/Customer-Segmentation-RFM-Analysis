services:
  rfm-dashboard:
    build: .
    image: rfm-clv-dashboard:latest
    container_name: rfm-dashboard
    ports:
      - "8501:8501"
    volumes:
      # Persist the SQLite DB and generated CSVs across container restarts
      - ./data:/app/data
      - ./reports:/app/reports
    environment:
      - PYTHONUNBUFFERED=1
      - PYTHONDONTWRITEBYTECODE=1
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8501/_stcore/health', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  # Optional: run the backend pipeline as a one-shot job
  # Usage: docker compose run --rm pipeline-runner
  pipeline-runner:
    build: .
    image: rfm-clv-dashboard:latest
    container_name: rfm-pipeline-runner
    entrypoint: ["python", "run_pipeline.py"]
    volumes:
      - ./data:/app/data
      - ./reports:/app/reports
    profiles: ["pipeline"]  # only runs when explicitly invoked
